name: Weekly Freshness Radar

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Weekly Freshness Radar and open issue
        run: python scripts/freshness_radar.py --open-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
