name: Resilience Benchmark CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint benchmarks with ruff
        run: ruff check --select E,F --ignore E501 benchmarks/

      - name: Run benchmark unit tests
        run: pytest benchmarks/test_resilience_bench.py -v

      - name: Run CLI comparison check
        run: python -m benchmarks.resilience_bench --target compare
